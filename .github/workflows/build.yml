name: Build Squirrel.Windows

on:
  pull_request:
  push:
    branches:
      - "v1.x"

jobs:
  build:
    name: Build Squirrel.Windows
    runs-on: windows-2019
    timeout-minutes: 10

    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages/

    steps:

    - uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v2
      with:
        msbuild-architecture: x64

    - name: Cache nuget packages
      id: cache-nuget
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: NuGet restore
      run: ./.NuGet/NuGet.exe restore

    - name: Build Squirrel.Windows solution
      run: msbuild /p:Configuration=Release /property:Platform=x64

    - name: Prepare artifact
      shell: bash
      run: |
        vendor/7zip/7z.exe a Squirrel.Windows.zip @electron-builder.listfile.txt

    - uses: actions/upload-artifact@v4
      with:
        path: Squirrel.Windows.zip
